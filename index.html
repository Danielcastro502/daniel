<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Inglés con IA - Meta AI</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, sans-serif;
    background: #0f172a;
    color: white;
    padding: 1rem;
  }
 .container { max-width: 600px; margin: 0 auto; }
  h1 { text-align: center; margin: 1rem 0; color: #38bdf8; }
 .chat {
    background: #1e293b;
    border-radius: 12px;
    padding: 1rem;
    height: 400px;
    overflow-y: auto;
    margin-bottom: 1rem;
  }
 .msg { margin: 0.8rem 0; padding: 0.8rem; border-radius: 8px; }
 .user { background: #0ea5e9; margin-left: 20%; }
 .bot { background: #334155; margin-right: 20%; }
 .input-area { display: flex; gap: 0.5rem; }
  input {
    flex: 1;
    padding: 0.8rem;
    border: none;
    border-radius: 8px;
    background: #334155;
    color: white;
    font-size: 1rem;
  }
  button {
    padding: 0.8rem 1.2rem;
    border: none;
    border-radius: 8px;
    background: #0ea5e9;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
 .tip { font-size: 0.8rem; color: #94a3b8; text-align: center; margin-top: 1rem; }
 .error { background: #ef4444; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
</style>
</head>
<body>
  <div class="container">
    <h1>🤖 English Bot con Meta AI</h1>
    <div id="error" class="error" style="display:none;"></div>
    <div class="chat" id="chat">
      <div class="msg bot">
        Hi! Soy tu profe de inglés con IA. Escríbeme algo en español y te ayudo a decirlo en inglés + te corrijo. <br><br>
        Ej: "Quiero aprender a pedir un café"
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Escribe en español..." />
      <button id="sendBtn">Enviar</button>
    </div>
    <p class="tip">⚡ Usando Meta AI (Llama) para respuestas en tiempo real</p>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const errorDiv = document.getElementById('error');

// Configuración de la API
const HUGGING_FACE_API = 'https://api-inference.huggingface.co/models/meta-llama/Llama-2-7b-chat';

// Obtén el token desde GitHub Secrets o variables de entorno
const TOKEN = process.env.HUGGING_FACE_TOKEN || localStorage.getItem('hf_token');

if (!TOKEN) {
  showError('⚠️ Token no configurado. Ve a Settings → Secrets para agregar HUGGING_FACE_TOKEN');
}

function showError(msg) {
  errorDiv.textContent = msg;
  errorDiv.style.display = 'block';
  setTimeout(() => { errorDiv.style.display = 'none'; }, 5000);
}

async function getAIResponse(textoEspañol) {
  try {
    const prompt = `Eres un profesor de inglés. El estudiante te dice esto en español: "${textoEspañol}"

Responde con:
1. La traducción al inglés
2. La pronunciación (fonética)
3. Una corrección gramatical si es necesario
4. Un ejemplo de uso

Sé conciso y educativo.`;

    const response = await fetch(HUGGING_FACE_API, {
      headers: { Authorization: `Bearer ${TOKEN}` },
      method: 'POST',
      body: JSON.stringify({ inputs: prompt }),
    });

    if (!response.ok) {
      if (response.status === 401) {
        throw new Error('Token inválido o expirado');
      }
      throw new Error(`Error: ${response.status}`);
    }

    const result = await response.json();
    return result[0]?.generated_text || 'No se pudo generar respuesta';
  } catch (error) {
    console.error('Error:', error);
    showError(`❌ Error: ${error.message}`);
    return `Disculpa, hubo un error conectando con la IA. Intenta de nuevo.`;
  }
}

function addMessage(texto, clase) {
  const msg = document.createElement('div');
  msg.className = `msg ${clase}`;
  msg.innerHTML = texto;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

async function handleSend() {
  const texto = input.value.trim();
  if (!texto) return;
  if (!TOKEN) {
    showError('Por favor configura tu token de Hugging Face');
    return;
  }

  addMessage(texto, 'user');
  input.value = '';
  sendBtn.disabled = true;
  sendBtn.textContent = '⏳ Pensando...';

  const respuestaIA = await getAIResponse(texto);
  addMessage(respuestaIA, 'bot');

  sendBtn.disabled = false;
  sendBtn.textContent = 'Enviar';
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keypress', e => {
  if (e.key === 'Enter') handleSend();
});
</script>
</body>
</html>
